name: Android CI

on:
  push:
    branches:
      - master
      # Temporary: build this branch too. Remove before merging.
      - optimisation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      # An artifact uploaded as it is takes the name of the file, so the file is named here
      # rather than the artifact below.
      - name: Name the APK
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            build/artifacts/AdAway-development.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/AdAway-development.apk
          # Upload the file as it is, so it downloads as an APK instead of a zip holding one.
          archive: false

      - name: Update dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph-include-projects: ":app"
          dependency-graph-include-configurations: "releaseCompileClasspath"
